<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>AIStudy 插件设置</title>
<style>body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:520px;margin:30px auto;padding:0 16px;color:#22252b}
label{display:block;margin-top:14px;font-weight:600}input[type=text]{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;font-size:15px;margin-top:4px}
button{margin-top:16px;padding:10px 18px;border:none;border-radius:99px;background:#2f6f5e;color:#fff;font-size:15px;cursor:pointer}
.muted{color:#6b7079;font-size:13px}.ok{color:#2f6f5e}.err{color:#b4442b}</style></head>
<body>
<h2>📚 AIStudy 划词查词 · 设置</h2>
<p class="muted">在 AIStudy 网站登录孩子的账号 → 顶部「工具」→「生成连接码」，把网站地址和连接码填到这里。</p>
<label>AIStudy 网站地址</label><input type="text" id="server" placeholder="https://study.example.com">
<label>连接码</label><input type="text" id="token" placeholder="ais_...">
<label style="font-weight:normal"><input type="checkbox" id="bubble"> 选中文字后自动显示「🔍 查」按钮（关掉后只能用右键菜单查）</label>
<button id="save">保存并测试</button>
<p id="msg"></p>
<script src="config.js"></script>
<script src="options.js"></script>
</body></html>
