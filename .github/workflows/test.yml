name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aistudy
          POSTGRES_PASSWORD: aistudy
          POSTGRES_DB: aistudy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aistudy" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Tests (PostgreSQL)
        run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://aistudy:aistudy@127.0.0.1:5432/aistudy_test
      - name: Lint install.sh
        run: shellcheck -S warning install.sh
