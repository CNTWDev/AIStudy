# 乐园：深紫描边，音效换成清亮的正弦音、整体高一点（像闪光的应援棒）
[play]
ink = "#3a2050"
wave = "sine"
pitch = 1.12

# 乐园「白天」场景换成舞台灯光下的粉紫色
[play.day]
sky = ["#ffc4e1", "#fde9ff"]
hill = ["#d9b8f0", "#c39be6"]
ground = "#f6c7de"
soil = "#d99cc0"
cloud = "#fff5fb"

# 记录页「我的积累」里装满的那个东西（app/growth.py 的 board）：一个装 100 道题
[grow]
icon = "💡"
name = "盏灯"
