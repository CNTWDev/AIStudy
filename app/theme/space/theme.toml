# 乐园：深蓝描边，音效换成方波「哔哔」声（像老游戏机）
[play]
ink = "#1d2340"
wave = "square"
pitch = 1.0

# 乐园「白天」场景换成星球表面
[play.day]
sky = ["#1d2a5c", "#4a5aa8"]
hill = ["#5b6bb5", "#46559c"]
ground = "#9aa7d8"
soil = "#6b76a8"
cloud = "#7f8fd0"
stars = true
