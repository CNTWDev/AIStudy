{% extends "base.html" %}
{% from "_speak.html" import mic, wave %}
{% block title %}和 AI 聊 · 开口练{% endblock %}
{% block body %}
{% set pl = s.data.play %}
<div class="sk-top"><a href="/speak" class="linkbtn" aria-label="回到开口练">‹</a><h1>和 AI 聊</h1><span class="r" id="cnt"></span></div>
<div class="card" style="padding:12px 14px">
  <div class="small"><b>这一局</b>：{{ pl.setup }}{% if pl.goal %}<span class="faint"> 你要：{{ pl.goal }}</span>{% endif %}</div>
</div>
<div id="log"></div>
<div id="tail"></div>
<template id="mictpl">{{ wave() }}{{ mic(small=true) }}<div class="sk-hint" id="hint"></div></template>
<div id="after" hidden></div>
<script src="/static/speak.js?v={{ ASSET_V }}"></script>
<script>
const S = {id: {{ s.id }}, turns: {{ s.data.turns|tojson }}, who: {{ (pl.who or '对方')|tojson }}, accent: {{ accent|lower|tojson }},
           done: {{ (s.done_at is not none)|tojson }}, close: {{ (s.data.close or none)|tojson }}, max: {{ max_turns }}, hint: {{ hint_turns }}};
const log = $('#log');
const bubble = t => t.who === 'ai'
  ? `<div class="sk-who">${esc(S.who)}（AI）</div><div class="sk-bub ai" style="display:flex;gap:8px;align-items:flex-start">${playBtn(t.text, S.accent)}<span>${esc(t.text)}</span></div>`
  : `<div class="sk-who me">你</div><div class="sk-bub me">${markZh(t.text) || '<span class="muted">（没听清）</span>'}</div>`;
const mine = () => S.turns.filter(t => t.who === 'me').length;
function draw() {
  log.innerHTML = S.turns.map(bubble).join('');
  $('#cnt').textContent = S.done ? '聊完了' : `第 ${mine() + 1} 轮 · 随时结束`;
  if (S.done) return closed(S.close);
  $('#tail').innerHTML = mine() < S.max ? $('#mictpl').innerHTML : '';
  $('#tail').insertAdjacentHTML('beforeend', `<p class="sk-hint" style="min-height:0">${mine() >= S.hint && mine() < S.max ? `已经聊了 ${mine()} 轮，很棒。想接着聊就接着说，` : ''}<a href="#" id="end" style="font-weight:600">${mine() ? '聊到这里，看看今天学到什么 ›' : '不聊了'}</a></p>`);
  $('#end').onclick = e => { e.preventDefault(); end(); };
  if (!$('#mic')) return;
  $('#hint').innerHTML = '按住回答 · 卡住就说中文';
  micButton($('#mic'), {hint: '#hint', wave: '#wave', recHint: '卡住就说中文', onClip: async blob => {
    const r = await sendClip('/api/speak/chat/turn', blob, {session: S.id});
    S.turns.push({who: 'me', text: r.me}, {who: 'ai', text: r.reply});
    draw(); scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
    Speak.play(r.reply, S.accent, 'sentence');
  }});
}
async function end() {
  if (!mine()) { await api('/api/speak/chat/close', {session: S.id}).catch(() => {}); location.href = '/speak'; return; }
  $('#tail').innerHTML = '<div id="cbox"></div>';
  const btn = document.createElement('button'); btn.hidden = true; $('#cbox').after(btn);
  const w = aiWait(btn, $('#cbox'), 'speak_rewrite', null);
  try { const c = await api('/api/speak/chat/close', {session: S.id}); w.end(); S.done = true; S.close = c; draw(); }
  catch (e) { w.fail(); toast(e.message); draw(); }
}
function closed(c) {
  $('#tail').innerHTML = c ? `${cheer(`用英文聊了 ${mine()} 轮`, c.note ? `做得最好的：${esc(c.note)}` : '能接得住对方的话，就是真的在用英文了。', {big: true})}
    ${(c.chunks || []).length ? rise(`<div class="card"><div class="sk-lbl">今天学 ${c.chunks.length} 个表达</div>${chunkList(c.chunks)}</div>`, 1) : ''}
    ${rise(fixBox(c.fix), 2)}
    <p class="sk-note">${(c.chunks || []).length ? '这几个表达存进了「我的表达库」，明天开始回来复习。' : ''}</p>
    <div id="totals"></div>
    <a class="sk-opt" href="/speak"><div class="oi">再</div><div><div class="n">再来一局 / 再说一件</div><div class="m">回到开口练</div></div><span class="go">›</span></a>
    <p class="sk-hint" style="min-height:0"><a href="/speak" style="color:var(--ink);font-weight:600">先到这里</a> · 多练不算任务，明天也不会变多</p>` : '';
  if (c) Totals.show($('#totals'), 0.3);
}
Totals.load();
draw();
if (!S.done && S.turns.length === 1) setTimeout(() => Speak.play(S.turns[0].text, S.accent, 'sentence'), 400);
</script>
{% endblock %}
