{% extends "base.html" %}
{% from "_speak.html" import mic, wave, steps %}
{% block title %}复习表达 · 开口练{% endblock %}
{% block body %}
<div class="sk-top"><a href="/speak" class="linkbtn" aria-label="回到开口练">‹</a><h1>开口练</h1><span class="r" id="cnt"></span></div>
{% if then %}{{ steps(0) }}{% endif %}
<div id="stage"></div>
<template id="mictpl">{{ wave() }}{{ mic() }}<div class="sk-hint" id="hint"></div></template>
<script src="/static/speak.js?v={{ ASSET_V }}"></script>
<script>
const ITEMS = {{ items|tojson }}, THEN = {{ then|tojson }}, ACCENT = {{ accent|lower|tojson }};
const stage = $('#stage');
let k = 0, said = 0;
function show() {
  if (k >= ITEMS.length) return finish();
  const c = ITEMS[k];
  $('#cnt').textContent = `复习 ${k + 1} / ${ITEMS.length}`;
  stage.innerHTML = `<div class="card" style="text-align:center;padding:26px 16px"><div class="sk-lbl">用英文说</div>
      <div style="font-size:24px;font-weight:800;margin:6px 0">${esc(c.zh || c.en)}</div>
      <div class="small faint">${c.box ? `第 ${c.box + 1} 次复习` : '第 1 次复习'}</div></div>
    <div id="res"></div><div id="micbox">${$('#mictpl').innerHTML}</div>`;
  $('#hint').innerHTML = '按住说一句完整的话，松开结束<br><a href="#" id="peek">想不起来，看看</a>';
  $('#peek').onclick = e => { e.preventDefault(); result(null); };
  micButton($('#mic'), {hint: '#hint', wave: '#wave', onClip: async blob => { result(await sendClip('/api/speak/review/clip', blob, {chunk: c.id})); }});
}
function result(r) {
  const c = ITEMS[k];
  $('#micbox').remove();
  const top = !r ? cheer('想不起来很正常', '听一遍常见说法，跟着小声说一次。明天它还会回来，第二次就快了。', {soft: true, quiet: true, icon: '▶'})
    : r.hit ? cheer('说出来了！', `「${esc(c.en)}」正在变成你自己的。${c.box ? `这是第 ${c.box + 1} 次复习，越来越熟了。` : ''}`, {big: true})
    : cheer('开口说了，这就有用', '对照下面的常见说法再读一遍，记得更牢。系统没认出这个表达不一定是你没说（语音识别也会听错），你觉得说出来了就点「说出来了」。', {soft: true, icon: '👏'});
  $('#res').innerHTML = top + `<div class="card sk-rise" style="--d:.2s">${r ? `<div class="sk-lbl">你说的</div><div class="sk-en">${markChunks(r.text, [c]) || '<span class="muted">（没听清）</span>'}</div>` : ''}
      <div class="sk-lbl" style="margin-top:12px">常见说法</div>
      <div class="sk-en row" style="gap:8px;flex-wrap:nowrap">${playBtn(c.say, ACCENT)}<span>${markChunks(c.say, [c])}</span></div>
</div>
    <div class="row" style="gap:10px"><button class="btn ghost" id="no">没说出来</button><button class="btn" id="yes">说出来了</button></div>
    <p class="sk-hint" style="min-height:0">没说出来的，明天再来一次</p>`;
  if (!r) { $('#no').className = 'btn'; $('#yes').className = 'btn ghost'; }   // 只有点了「想不起来，看看」才默认是没说出来；识别结果只是参考，由本人定
  const grade = async ok => {
    try { await api('/api/speak/review/grade', {chunk: c.id, ok}); } catch (e) { toast(e.message); return; }
    if (ok) { said++; $('#yes').classList.add('sk-yes'); await new Promise(f => setTimeout(f, 320)); }
    k++; show();
  };
  $('#yes').onclick = () => grade(true); $('#no').onclick = () => grade(false);
  if (!r) Speak.play(c.say, ACCENT, 'sentence');
}
function finish() {
  $('#cnt').textContent = '';
  stage.innerHTML = ITEMS.length
    ? cheer(said ? `今天说出来 ${said} 个表达` : '今天的复习做完了', `${said ? `复习了 ${ITEMS.length} 个，说出来 ${said} 个。` : '每看一遍都在加深印象，明天会更熟。'}保底的那几分钟已经算今天练过了。`, {big: true})
    : `<div class="card" style="text-align:center;padding:26px 16px"><div style="font-size:22px;font-weight:800">今天没有要复习的表达</div><p class="muted small">学过的表达过一天就会回来。</p></div>`;
  stage.innerHTML += `
    ${THEN ? '<a class="btn" style="width:100%" href="/speak/go?skip=1">去今天的场景</a><p class="sk-hint" style="min-height:0"><a href="/speak" style="color:var(--ink);font-weight:600">先到这里</a></p>' : '<a class="btn" style="width:100%" href="/speak">回到开口练</a>'}`;
}
show();
</script>
{% endblock %}
