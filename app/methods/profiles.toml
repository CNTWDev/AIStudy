# 学习方式（教学理念）：每种方式 = 掌握模型 + 记忆模型 + 每日计划策略 + 各自的参数。
# 家长可以给每个孩子选一种（孩子资料页「学习方式」），管理员可以设全站默认。
# 换方式后，这个孩子的掌握状态会按新方式从学习记录（events 表）重新算一遍。
#
# 要改参数或加一种方式：在 config/methods.toml 里写同名 [profiles.xxx] 覆盖或新增（不用改这个文件）。
# 要换一种算法（不只是调参数）：在 app/methods/ 里写一个新类，实现同样的接口，注册到 app/methods/__init__.py，
# 然后在这里用 model = "新名字" 引用。
#
# plan（每日计划）：
#   fixed  每天都有的任务，排在最前，按顺序（坚持比做对更重要，不受时间预算限制）
#          主线是「先易后难再放松」：热身（几道小题进入状态）→ 错题重做（旧账先清）→ 单词 → flex 学新的、补弱的 → tail
#   tail   每天都有的任务，排在最后（默认是阅读：大量输入，放松收尾），同样不受时间预算限制
#   flex   学知识点的任务，按顺序排，超出每天可用时间就截掉；"a+b" 表示两类交替穿插（交错练习）
#   limits 每类最多几个（weak 是每个学科最多几个）
#   mix    每门课一组混合练习（任务类型 mix，见 app/mix.py）里各成分的比例：
#          new 学校正在学的 / recent 最近学的、按遗忘规律该复习的 / past 以前学过的（往回一直到一年级、跨教材跨学科）/
#          cross 换个问法交叉校验 / preview 预习。题量按每天时长自动算（排完其它任务剩下的时间都给它）
#   drill  「快练 5 分钟」：口算、单词、术语、公式单位，限时连对加倍
#   prefer_hot  高频考点排前面
#   exam / exam_date  设了考试日期的课按剩余天数排新内容（最后两周冲刺高频考点）；职业资格考试的课没设日期时提醒设一个
# 可用的任务类型见 app/plan.py 的 SOURCES。

default = "balanced"

[profiles.balanced]
name = "均衡"
desc = "检索练习 + 间隔复习 + 交错练习 + 掌握学习：跟上学校进度，补弱和补前置交替，学有余力再预习。"
basis = "Roediger & Karpicke 2006（检索练习）；Cepeda 等 2006（间隔效应）；Rohrer 2012（交错练习）；Bloom 1968（掌握学习）"
mastery = { model = "bkt" }
memory = { model = "fsrs", target_r = 0.85 }
[profiles.balanced.plan]
fixed = ["exam_date", "warmup", "mistakes", "words", "drill"]
flex = ["top", "paper", "diagnose", "exam", "lesson", "mix", "weak+backfill", "review"]
tail = ["reading"]
limits = { top = 1, paper = 1, diagnose = 1, weak = 1, preview = 1 }
mix = { new = 0.3, recent = 0.2, past = 0.3, cross = 0.1, preview = 0.1 }

[profiles.mastery]
name = "先学牢再往前"
desc = "掌握学习：掌握标准更严（真懂的概率 90%、3 个不同的日子答对），先补前置再攻克，不预习新内容。适合基础不牢、经常“学了后面忘前面”的孩子。"
basis = "Bloom 1968 / Guskey 2007（掌握学习）；Kulik 等 1990（掌握学习的元分析）"
mastery = { model = "bkt", master_p = 0.9, min_days = 3 }
memory = { model = "fsrs", target_r = 0.9 }
[profiles.mastery.plan]
fixed = ["exam_date", "warmup", "mistakes", "words", "drill"]
flex = ["top", "paper", "diagnose", "exam", "lesson", "backfill", "mix", "weak", "review"]
tail = ["reading"]
limits = { top = 1, paper = 1, diagnose = 1, weak = 1, preview = 0 }
mix = { new = 0.25, recent = 0.25, past = 0.4, cross = 0.1, preview = 0 }

[profiles.exam]
name = "考前冲刺"
desc = "考前两三周用：高频考点和薄弱点优先，复习间隔缩短（记得的概率保持在 90% 以上），不安排预习和摸底。考完记得换回来。"
basis = "Agarwal 等 2021（检索练习对考试成绩的综述）；Cepeda 等 2008（离考试越近，最优间隔越短）"
mastery = { model = "bkt" }
memory = { model = "fsrs", target_r = 0.9 }
[profiles.exam.plan]
fixed = ["exam_date", "mistakes", "words", "drill"]
flex = ["top", "exam", "paper", "lesson", "mix", "weak+backfill", "review"]
tail = ["reading"]
limits = { top = 1, paper = 1, weak = 2, preview = 0 }
mix = { new = 0.2, recent = 0.4, past = 0.3, cross = 0.1, preview = 0 }
prefer_hot = true
